<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Relay — Product inbox</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;background:#f7f8fc;color:#11162a}svg{display:block;width:100%;height:100%}.frame{position:relative;width:1920px;height:1080px;overflow:hidden;background:linear-gradient(135deg,#fbfcff 0 59%,#eceaff 59% 100%)}
.orb{position:absolute;width:700px;height:700px;border-radius:50%;right:-230px;top:-310px;background:#dce4ff;filter:blur(1px);opacity:.7}.brand{position:absolute;left:6.25%;top:6%;display:flex;align-items:center;gap:14px;font-weight:800;font-size:24px;letter-spacing:-.03em}.mark{display:grid;grid-template-columns:11px 15px;grid-template-rows:11px 11px;gap:5px}.mark i{background:#2457ff;border-radius:4px}.mark i:first-child{grid-row:1/3}
.copy{position:absolute;left:6.25%;top:25%;width:35%;z-index:3}.eyebrow{margin-bottom:23px;color:#2457ff;font-size:15px;line-height:1;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.copy h1{margin:0;font-size:80px;line-height:1.01;letter-spacing:-.06em}.copy p{width:88%;margin:30px 0 0;color:#636a80;font-size:21px;line-height:1.5}.source-row{display:flex;gap:10px;margin-top:34px}.source-row span{padding:10px 14px;border:1px solid #d9ddeb;border-radius:99px;background:#fff;color:#687087;font-size:13px;font-weight:700}
.stage{position:absolute;right:3.5%;top:13%;width:53%;height:75%;border-radius:56px;background:linear-gradient(145deg,#dedcff,#f1f0ff);box-shadow:inset 0 1px 0 #fff,0 50px 100px rgba(42,46,91,.12);transform:perspective(1400px) rotateY(-5deg) rotateX(2deg)}.app{position:absolute;inset:5.2%;display:grid;grid-template-columns:180px 1fr;background:#fff;border:1px solid rgba(17,22,42,.12);border-radius:26px;overflow:hidden;box-shadow:0 28px 70px rgba(17,22,42,.18)}
.side{padding:24px 18px;background:#13182b;color:#fff}.sidebrand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:2px 4px 38px}.sidebrand b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#2457ff}.nav{padding:13px 14px;margin:7px 0;border-radius:10px;color:#9fa6bc;font-size:14px;font-weight:700}.nav.active{background:#262d47;color:#fff}
.main{padding:28px 30px}.top{display:flex;align-items:center;justify-content:space-between}.top h2{font-size:25px;letter-spacing:-.04em;margin:0}.add{padding:12px 16px;border-radius:10px;background:#2457ff;color:#fff;font-size:13px;font-weight:800}.tabs{display:flex;gap:25px;margin-top:28px;border-bottom:1px solid #e4e7f0}.tab{padding:0 0 13px;color:#858ba0;font-size:13px;font-weight:800}.tab.active{color:#11162a;border-bottom:3px solid #2457ff}.row{display:grid;grid-template-columns:38px 1fr 105px;gap:15px;align-items:center;padding:18px 4px;border-bottom:1px solid #eceef4}.icon{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#eef1ff;color:#2457ff;font-size:11px;font-weight:900}.note b{display:block;font-size:15px;margin-bottom:6px}.note span{color:#747b90;font-size:13px}.tag{justify-self:end;padding:8px 10px;border-radius:8px;background:#f2f3f8;color:#646b80;font-size:11px;font-weight:800}.row.focus{margin:7px -10px;padding:16px 14px;border:1px solid #b9c8ff;border-radius:13px;background:#f5f7ff;box-shadow:0 10px 30px rgba(36,87,255,.1)}
</style>
</head>
<body><svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Relay customer feedback inbox"><foreignObject width="1920" height="1080"><main xmlns="http://www.w3.org/1999/xhtml" class="frame">
  <div class="orb"></div><div class="brand"><span class="mark"><i></i><i></i><i></i></span>Relay</div>
  <section class="copy"><div class="eyebrow">One product inbox</div><h1>Meet Relay. One inbox for what customers need next.</h1><p>Every note keeps its source, account context, and exact customer language.</p><div class="source-row"><span>Support</span><span>Calls</span><span>Notes</span></div></section>
  <section class="stage"><div class="app">
    <aside class="side"><div class="sidebrand"><b>R</b>Relay</div><div class="nav active">Inbox</div><div class="nav">Insights</div><div class="nav">Build tasks</div><div class="nav">Archive</div></aside>
    <div class="main"><div class="top"><h2>Feedback inbox</h2><span class="add">+ Add note</span></div><div class="tabs"><span class="tab active">All feedback</span><span class="tab">Unsorted</span><span class="tab">Connected</span></div>
      <div class="row"><span class="icon">IN</span><div class="note"><b>Managers need edit controls</b><span>Support inbox · Northwind</span></div><span class="tag">Access</span></div>
      <div class="row focus"><span class="icon">CL</span><div class="note"><b>Different access for contractors</b><span>Customer call · Juniper</span></div><span class="tag">New note</span></div>
      <div class="row"><span class="icon">DM</span><div class="note"><b>Every member becomes an admin</b><span>Founder note · Pilot review</span></div><span class="tag">Access</span></div>
      <div class="row"><span class="icon">CS</span><div class="note"><b>Add viewer and editor roles</b><span>Success handoff · Fieldstone</span></div><span class="tag">Roles</span></div>
    </div>
  </div></section>
</main></foreignObject></svg></body></html>
